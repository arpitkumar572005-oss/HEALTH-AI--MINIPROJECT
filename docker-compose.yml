version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: healthai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: healthai_user
      POSTGRES_PASSWORD: healthai_secure_password
      POSTGRES_DB: healthai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthai_user -d healthai_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: healthai-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://healthai_user:healthai_secure_password@postgres:5432/healthai_db
      JWT_SECRET: production-grade-healthai-secret-key-change-in-prod
      ENVIRONMENT: production
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: healthai-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
